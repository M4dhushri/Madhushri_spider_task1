            let angle = 0;
            let direction = 1;
           
            function spin() {
               
                angle+=1*direction;

                radians = angle * (Math.PI / 180);


                if (angle >= 180) direction = -1;
                if (angle <= 0) direction = 1;

                rotatingElement.style.transform=`rotate(${-angle+360}deg)`;
                animationId=requestAnimationFrame(spin);
            }

            spin('rotatingElement');
